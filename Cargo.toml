[package]
name = "npma"
version = "0.1.0"
description = "Nginx Proxy Manager access log analyzer"
authors = ["egoroff <egoroff@gmail.com>"]
repository = "https://github.com/aegoroff/npma"
homepage = "https://github.com/aegoroff/npma"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["io-util"] }
async-stream = "0.3"
clap = { version = "4.6.7", features = ["std", "color", "suggestions", "cargo"] }
clap_complete = "4.6.11"
regex = "1.13.1"
comfy-table = "8.0.1"
color-eyre = "0.6.5"
indicatif = "0.18.6"
chrono = { version="0.4.45", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = "0.1.52"

[dev-dependencies]
test-case = "3.4.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = 'abort'

[lints.rust]
unsafe_code = "forbid"
